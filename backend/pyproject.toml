[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-studio-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "pymupdf==1.28.2", "httpx==0.28.1",
  "jsonschema==4.26.0", "python-multipart==0.0.32", "pydantic-settings==2.15.0"
]

[project.optional-dependencies]
manim = ["manim==0.19.0"]
